<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Vincere CRM</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div class="brand"><span class="dot"></span> VINCERE</div>
  <div class="topbar">
    <input class="search" id="globalSearch" placeholder="Search clients, vehicles, stock #, VIN…" autocomplete="off">
    <button class="btn sm" id="quickAddClient">+ Client</button>
    <button class="btn sm" id="quickBackup">Backup</button>
  </div>
  <nav class="nav" id="nav"></nav>
  <main class="main" id="view"><!-- rendered by app.js --></main>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
