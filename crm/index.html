<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vincere CRM">
<meta name="theme-color" content="#0a0b0d">
<title>Vincere Lexus — Sales CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<!-- Optional: real iMessage/SMS threads written by scripts/import_iphone_backup.py.
     Absent until you run the importer; the app falls back to sample threads. -->
<script src="messages.js" onerror="window.__noMessages=true"></script>
<!-- Your real Google Calendar + Todoist, pulled through Claude (crm/agenda.js).
     Absent until synced; the app just hides the agenda panels if missing. -->
<script src="agenda.js" onerror="window.__noAgenda=true"></script>
<!-- Cross-device sync (optional). The CDN client + your keys enable Supabase;
     if either is missing the app runs offline on localStorage. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="window.__noSupabase=true"></script>
<script src="supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
