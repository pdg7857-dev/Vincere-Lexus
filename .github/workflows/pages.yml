# Publishes the site to GitHub Pages on every push to this branch.
# actions/configure-pages with enablement:true creates the Pages site
# itself, so no repository-settings visit is needed.
name: Deploy Pages
on:
  push:
    branches: [claude/phil-dave-luxury-car-site-a1vau4]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
